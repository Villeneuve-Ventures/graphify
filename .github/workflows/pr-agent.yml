name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

concurrency:
  # Only eligible review requests share a PR-scoped group. Other comments use
  # their own run ID so a bot response or unrelated comment cannot cancel an
  # in-progress review before the job-level guard skips that event.
  group: >-
    pr-agent-${{
      github.event.pull_request.number ||
      (
        github.event_name == 'issue_comment' &&
        github.event.sender.type != 'Bot' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/prreview' &&
        contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association
        ) &&
        github.event.issue.number
      ) ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are unavailable to pull_request workflows from forks. Review those
    # only after a trusted maintainer explicitly comments /prreview, which runs
    # from the default branch through issue_comment.
    if: >-
      ${{
        github.event.sender.type != 'Bot' &&
        (
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.comment.body == '/prreview' &&
            contains(
              fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
              github.event.comment.author_association
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned PR-Agent
        run: >-
          python -m pip install --disable-pip-version-check
          "git+https://github.com/qodo-ai/pr-agent.git@1885eb4056887b8c8a530f0a35b842bba05cb425"

      - name: Run PR-Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Keep provider-critical settings in the trusted workflow as well as
          # .pr_agent.toml. This prevents a missing/unreadable repo config from
          # silently falling back to PR-Agent's default OpenAI model.
          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          config.reasoning_effort: "high"
          config.custom_model_max_tokens: "1048576"
          config.max_model_tokens: "65536"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          # Publish the generated summary as its own persistent comment instead
          # of replacing the maintainer-authored PR title or description.
          pr_description.publish_description_as_comment: "true"
          pr_description.publish_description_as_comment_persistent: "true"
          # Initial non-draft events run the summary and full review. Later
          # changes wait for an explicit /prreview incremental review request.
          github_action_config.handle_push_trigger: "false"
          pr_reviewer.publish_output_no_suggestions: "true"
          pr_reviewer.persistent_comment: "true"
          pr_reviewer.final_update_message: "true"
        run: |
          python - <<'PY'
          import asyncio
          import os

          from pr_agent.algo import SUPPORT_REASONING_EFFORT_MODELS

          # PR-Agent at the pinned revision does not yet list these stable model
          # IDs in its reasoning-effort allowlist. LiteLLM 1.92 supports their
          # reasoning_effort parameter, so extend the in-memory list before
          # importing the runner and its AI handler. .pr_agent.toml supplies the
          # corresponding custom token limit.
          for model in ("gemini-3.6-flash", "gemini-3.5-flash-lite"):
              if model not in SUPPORT_REASONING_EFFORT_MODELS:
                  SUPPORT_REASONING_EFFORT_MODELS.append(model)

          # The pinned tools catch their own exceptions. Wrap both initial tools
          # so a missing prediction or publication fails the Actions check.
          from pr_agent.agent.pr_agent import PRAgent
          from pr_agent.tools.pr_description import PRDescription
          from pr_agent.tools.pr_reviewer import PRReviewer

          verification = {
              "description_completed": False,
              "incremental_review": False,
              "review_completed": False,
          }

          original_description = PRDescription.run

          async def run_verified_description(self):
              description_published = False
              original_publish = self.git_provider.publish_persistent_comment

              def publish_verified_description(*args, **kwargs):
                  nonlocal description_published
                  result = original_publish(*args, **kwargs)
                  if kwargs.get("name") == "describe":
                      description_published = True
                  return result

              self.git_provider.publish_persistent_comment = (
                  publish_verified_description
              )
              try:
                  await original_description(self)
              finally:
                  self.git_provider.publish_persistent_comment = original_publish

              if not self.prediction:
                  raise RuntimeError("PR-Agent did not produce a summary prediction")
              if not description_published:
                  raise RuntimeError("PR-Agent did not publish its summary comment")
              verification["description_completed"] = True

          PRDescription.run = run_verified_description

          original_review = PRReviewer.run

          async def run_verified_review(self):
              requested_incremental = bool(self.args and self.args[0] == "-i")
              persistent_review_published = False
              incremental_review_published = False
              original_publish_persistent = (
                  self.git_provider.publish_persistent_comment
              )
              original_publish_comment = self.git_provider.publish_comment

              def publish_verified_persistent_review(*args, **kwargs):
                  nonlocal persistent_review_published
                  result = original_publish_persistent(*args, **kwargs)
                  persistent_review_published = True
                  return result

              def publish_verified_incremental_review(*args, **kwargs):
                  nonlocal incremental_review_published
                  result = original_publish_comment(*args, **kwargs)
                  if not kwargs.get("is_temporary", False):
                      incremental_review_published = True
                  return result

              self.git_provider.publish_persistent_comment = (
                  publish_verified_persistent_review
              )
              self.git_provider.publish_comment = publish_verified_incremental_review
              try:
                  await original_review(self)
              finally:
                  self.git_provider.publish_persistent_comment = (
                      original_publish_persistent
                  )
                  self.git_provider.publish_comment = original_publish_comment

              if requested_incremental:
                  if not incremental_review_published:
                      raise RuntimeError(
                          "PR-Agent did not publish its incremental review"
                      )
              else:
                  if not self.prediction:
                      raise RuntimeError(
                          "PR-Agent did not produce a review prediction"
                      )
                  if not persistent_review_published:
                      raise RuntimeError(
                          "PR-Agent did not publish its persistent review"
                      )

              verification["incremental_review"] = requested_incremental
              verification["review_completed"] = True

          PRReviewer.run = run_verified_review

          original_handle_request = PRAgent.handle_request

          async def handle_verified_request(self, pr_url, request, *args, **kwargs):
              # /prreview is the public GitHub command. Translate it to an
              # incremental review without exposing /review to other apps.
              if isinstance(request, str) and request.strip().lower() == "/prreview":
                  request = "/review -i"

              handled = await original_handle_request(
                  self, pr_url, request, *args, **kwargs
              )
              if handled is False:
                  raise RuntimeError("PR-Agent did not handle the review command")
              return handled

          PRAgent.handle_request = handle_verified_request

          from pr_agent.servers.github_action_runner import run_action

          asyncio.run(run_action())
          if not verification["review_completed"]:
              raise RuntimeError("PR-Agent did not complete a verified review")
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              if not verification["description_completed"]:
                  raise RuntimeError("PR-Agent did not complete a verified summary")
          if os.environ.get("GITHUB_EVENT_NAME") == "issue_comment":
              if not verification["incremental_review"]:
                  raise RuntimeError("/prreview did not request an incremental review")
          PY
