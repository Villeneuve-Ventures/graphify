name: PR-Agent — Commands

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  command:
    name: Run PR-Agent command
    if: >-
      ${{
        github.event.sender.type != 'Bot' &&
        startsWith(github.event.comment.body, '/') &&
        (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Require repository write permission
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${REQUESTER}/permission" --jq '.permission')"
          case "$permission" in
            write|maintain|admin) ;;
            *) echo "::error::PR-Agent commands require repository write permission."; exit 1 ;;
          esac

      - name: Run upstream PR-Agent command
        # Corrected v0.48.0 build; upstream source 981344be2755e303df501e18e3f60b848a188a80.
        uses: docker://ghcr.io/villeneuve-ventures/pr-agent-corrected@sha256:3bcccc82790c8dff4b58f3ea9805b225a79023cc6a69f3efab34c3e8ae53a36b
        # Route inside the container: GitHub recreates event.json for each step.
        with:
          entrypoint: python
          args: |
            -c "
            import json
            import os
            import re
            import shlex
            import sys
            from pathlib import Path

            event_path = Path(os.environ['GITHUB_EVENT_PATH'])
            event = json.loads(event_path.read_text(encoding='utf-8'))
            body = event.get('comment', {}).get('body', '')
            if re.match(r'^/review(?=\s|$)', body, re.IGNORECASE):
                sys.exit(0)
            # Match the pinned upstream lexer and action normalization. Parse
            # remaining arguments only for description commands.
            lexer = shlex.shlex(body, posix=True)
            lexer.whitespace_split = True
            lexer.quotes = chr(34)  # Upstream recognizes only double quotes.
            lexer.commenters = ''
            try:
                action = next(lexer, '').lstrip('/').lower()
                if action in ('describe', 'describe_pr'):
                    if list(lexer):
                        sys.exit('Description commands accept no arguments; edit the PR body manually.')
                    event['comment']['body'] = (
                        '/describe --pr_description.publish_description_as_comment=true'
                    )
                    event_path.write_text(json.dumps(event), encoding='utf-8')
            except ValueError:
                sys.exit('Invalid command quoting; no PR-Agent command was run.')
            match = re.match(r'^/prreview(?=\s|$)', body, re.IGNORECASE)
            if match:
                event['comment']['body'] = '/review' + body[match.end():]
                event_path.write_text(json.dumps(event), encoding='utf-8')
            os.execv('/entrypoint.sh', ['/entrypoint.sh'])
            "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: gemini/gemini-3.8-flash
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          config.reasoning_effort: high
          config.temperature: '1.0'
          config.propagate_tool_errors: 'true'
