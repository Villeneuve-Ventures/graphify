name: CI

on:
  push:
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skillgen-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Fast lint-style guard: the skill files under graphify/ are generated from
    # the fragments in tools/skillgen/. This fails if someone hand-edited a
    # generated file or forgot to re-run the generator and bless expected/, and it
    # runs the build-time validators that guard per-host coverage, the file_type
    # enum, the monolith round-trips, and the always-on round-trips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The audit-coverage, monolith-roundtrip, and always-on-roundtrip
          # validators read blobs from origin/v8. A shallow checkout omits that
          # ref, so fetch the full history here and the validators run for real
          # (rather than skipping). The other jobs stay shallow.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          prune-cache: true

      # --frozen keeps uv from re-resolving and rewriting uv.lock as a side
      # effect of `uv run`; the lock is committed and must not churn in CI.
      - name: Check generated skill artifacts are up to date
        run: uv run --frozen python -m tools.skillgen --check

      - name: Audit per-host v8 coverage
        run: uv run --frozen python -m tools.skillgen --audit-coverage

      - name: Check the file_type enum is a singleton
        run: uv run --frozen python -m tools.skillgen --schema-singleton

      - name: Round-trip the monoliths against v8
        run: uv run --frozen python -m tools.skillgen --monolith-roundtrip

      - name: Round-trip the always-on blocks against v8
        run: uv run --frozen python -m tools.skillgen --always-on-roundtrip

  test:
    name: Pytest shard ${{ matrix.shard }}/4
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6
        with:
          # test_skillgen.py reads pre-split skill bodies from the immutable
          # baseline commit via `git show`; a shallow checkout omits that history
          # and the baseline tests fail. Full history mirrors the skillgen-check job.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen installs straight from the committed uv.lock without re-resolving
      # or rewriting it, so CI never churns the lock.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install acceptance-pinned Git 2.55.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev
          git_build="$(mktemp -d "$RUNNER_TEMP/git-2.55.0.XXXXXX")"
          curl -fL https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz -o "$git_build/git.tar.xz"
          echo "457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357  $git_build/git.tar.xz" | sha256sum -c -
          tar -xJf "$git_build/git.tar.xz" -C "$git_build"
          make -C "$git_build/git-2.55.0" -j2 prefix="$git_build/install" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$git_build/install/bin" >> "$GITHUB_PATH"
          test "$("$git_build/install/bin/git" --version)" = "git version 2.55.0"

      # Hook authority checks include every ancestor. Hosted images can make
      # /opt world-writable, so allocate below / and admit the path before pytest.
      - name: Prepare trusted hook test parent
        run: |
          set -euo pipefail
          fixture_parent="$(sudo mktemp -d /graphify-hook-tests.XXXXXXXX)"
          sudo chown "$(id -u):$(id -g)" "$fixture_parent"
          stat -c '%a %u:%g %n' / /opt "$HOME" "$fixture_parent"
          .venv/bin/python - "$fixture_parent" <<'PY'
          import sys
          from pathlib import Path
          from graphify.hook_installation import _authority

          with _authority(Path(sys.argv[1]), False):
              pass
          print(f"Admitted hook test authority parent: {sys.argv[1]}")
          PY
          echo "GRAPHIFY_TEST_AUTHORITY_PARENT=$fixture_parent" >> "$GITHUB_ENV"

      - name: Run tests
        id: pytest
        # Module invocation makes the checkout-local observer importable.
        run: >-
          uv run --frozen python -m pytest -p tools.pytest_partition -p tools.pytest_timings
          --ci-shard=${{ matrix.shard }}
          --ci-timing-json "$RUNNER_TEMP/pytest-timings/timings.json"
          tests/ -q --tb=short

      - name: Upload pytest timing diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-timings-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-timings/
          if-no-files-found: warn
          retention-days: 30

      # Unlike timings, these receipts are required proof for each matrix child.
      - name: Record shard execution outcome
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          python -m tools.ci_pytest_gate record --shard=${{ matrix.shard }}
          --output "$RUNNER_TEMP/pytest-result/result.json"

      - name: Upload shard execution outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-result-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-result/result.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Python quality gate
    needs: [test]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download individual shard execution outcomes
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: pytest-result-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: ${{ runner.temp }}/pytest-results
          merge-multiple: false

      - name: Require all four successful shard executions
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: python -m tools.ci_pytest_gate check --receipts "$RUNNER_TEMP/pytest-results"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install acceptance-pinned Git 2.55.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev
          git_build="$(mktemp -d "$RUNNER_TEMP/git-2.55.0.XXXXXX")"
          curl -fL https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz -o "$git_build/git.tar.xz"
          echo "457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357  $git_build/git.tar.xz" | sha256sum -c -
          tar -xJf "$git_build/git.tar.xz" -C "$git_build"
          make -C "$git_build/git-2.55.0" -j2 prefix="$git_build/install" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$git_build/install/bin" >> "$GITHUB_PATH"
          test "$("$git_build/install/bin/git" --version)" = "git version 2.55.0"

      - name: Run protected verifier conformance with optimized Python
        run: uv run --frozen python -O -m pytest tests/test_protected_change_verifier.py -q --tb=short

      - name: Verify install works end-to-end
        run: uv run --frozen python -m tools.ci_pytest_gate smoke

      - name: Reject whole-run cancellation
        if: cancelled()
        run: exit 1

  security-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Advisory policy: findings and scanner failures remain nonblocking, but
    # completion and coverage are validated independently of the job conclusion.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install reporting Python
        id: reporting_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          prune-cache: true

      # Preserve the existing default-plus-dev environment, without extras.
      - name: Install dependencies
        run: uv sync --frozen

      - name: bandit (static security analysis)
        id: bandit
        continue-on-error: true
        run: uv run --frozen python -m tools.security_receipts scan --scanner bandit --output "$RUNNER_TEMP/security-receipts"

      - name: pip-audit (dependency vulnerabilities)
        id: pip_audit
        continue-on-error: true
        run: uv run --frozen python -m tools.security_receipts scan --scanner pip-audit --output "$RUNNER_TEMP/security-receipts"

      - name: Finalize security receipts
        if: always()
        continue-on-error: true
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          BANDIT_CONCLUSION: ${{ steps.bandit.conclusion }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          PIP_AUDIT_CONCLUSION: ${{ steps.pip_audit.conclusion }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Independent of uv and project packages: report failed uv preparation.
        run: '"${{ steps.reporting_python.outputs.python-path }}" -I -S tools/security_receipts.py finalize --output "$RUNNER_TEMP/security-receipts"'

      - name: Upload security receipts and raw output
        id: security_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-receipts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish security summary
        if: always()
        continue-on-error: true
        env:
          ARTIFACT_URL: ${{ steps.security_artifact.outputs.artifact-url }}
        run: '"${{ steps.reporting_python.outputs.python-path }}" -I -S tools/security_receipts.py publish --output "$RUNNER_TEMP/security-receipts"'

  leiden-binary-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Leiden binary smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          prune-cache: true

      - name: Install Graphify with the native Leiden wheel only
        run: |
          uv venv --python 3.14
          uv pip install --only-binary=graspologic-native ".[leiden]"

      - name: Run a tiny weighted partition
        run: >-
          uv run --no-project python -c
          "import networkx as nx;
          from graspologic_native import leiden;
          from graphify.cluster import _partition;
          graph = nx.Graph([('0', '1', {'weight': 10.0}), ('2', '3', {'weight': 10.0}), ('1', '2', {'weight': 0.01})]);
          partition = _partition(graph);
          communities = {frozenset(node for node, cid in partition.items() if cid == community) for community in set(partition.values())};
          assert callable(leiden) and communities == {frozenset({'0', '1'}), frozenset({'2', '3'})}"
